[project]
name = "politicai-models"
version = "0.1.0"
description = "Motor de ML do projeto politicAI: classificador de temática de IA (v0) e índice de tendência de desinformação por IA."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    # GLM de contagem (Binomial Negativa/Poisson) do índice de tendência --
    # ver forecasting/trend_index.py.
    "statsmodels>=0.14",
    # Rate limiting básico da API -- ver api/main.py.
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbformat>=5.9",
    "nbclient>=0.9",
    "httpx>=0.27",  # requerido por fastapi.testclient.TestClient (tests/test_api.py)
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
